name: Update GitHub Data

on:
  schedule:
    # Run every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger

# Pushes and PRs authenticate with WORKFLOW_PAT, so GITHUB_TOKEN only reads
permissions:
  contents: read

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository # zizmor: ignore[artipacked] -- the push step below uses these credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.WORKFLOW_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Update GitHub stars
        id: stars
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-github-stars.js

      - name: Update YouTube videos
        id: youtube
        continue-on-error: true
        run: node scripts/update-youtube-videos.js

      - name: Update talk statuses
        id: talks
        continue-on-error: true
        run: node scripts/update-talks-status.js

      - name: Update Medium blogs
        id: medium
        continue-on-error: true
        run: node scripts/update-medium-blogs.js

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code src/data/ || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push to branch if changed
        if: steps.git-check.outputs.changed == 'true'
        run: |
          BRANCH_NAME="auto-update-data-$(date +%Y%m%d-%H%M%S)"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git checkout -b "$BRANCH_NAME"
          git add src/data/projects.json src/data/videos.json src/data/blogs.json src/data/talks.json
          git commit -m "chore: update GitHub stars, YouTube videos, Medium blogs, and talk statuses"
          git push -u origin "$BRANCH_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_ENV"

      - name: Create Pull Request
        if: steps.git-check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          gh pr create \
            --title "chore: update GitHub stars, YouTube videos, Medium blogs, and talk statuses" \
            --body "Automated data update from scheduled workflow" \
            --base master \
            --head "$BRANCH_NAME"

      - name: Enable auto-merge
        if: steps.git-check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          PR_NUMBER=$(gh pr list --head "$BRANCH_NAME" --json number --jq '.[0].number')
          gh pr merge "$PR_NUMBER" --auto --squash

      - name: Fail if any update step failed
        if: >-
          steps.stars.outcome == 'failure' ||
          steps.youtube.outcome == 'failure' ||
          steps.talks.outcome == 'failure' ||
          steps.medium.outcome == 'failure'
        run: |
          echo "::error::Update steps failed: stars=${{ steps.stars.outcome }} youtube=${{ steps.youtube.outcome }} talks=${{ steps.talks.outcome }} medium=${{ steps.medium.outcome }}"
          exit 1
